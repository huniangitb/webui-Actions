name: Build and Maintain yarn.lock & Release

# 触发工作流的事件
on:
  # 1. 当代码推送到 Clean-C-webui 分支时自动触发
  push:
    branches:
      - Clean-C-webui

  # 2. 当有 Pull Request 指向 Clean-C-webui 分支时自动触发 (仅用于构建和检查)
  pull_request:
    branches:
      - Clean-C-webui

  # 3. 保留手动触发功能
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的仓库分支 (The branch to build)'
        required: true
        default: 'Clean-C-webui' # 默认使用 Clean-C-webui 分支
        type: string
      tag:
        description: 'Release Tag (e.g., v1.0.0). 留空则不创建 Release.'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    # 授权：允许工作流将代码推送回仓库 (用于 yarn.lock 维护)
    permissions:
      contents: write

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 动态决定检出哪个分支
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.branch) || github.ref }}

      # 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装依赖。这一步会自动创建或更新 yarn.lock 文件
      - name: Install dependencies
        run: yarn install

      # 检查 yarn.lock 文件是否有变动，如果有则自动提交
      - name: Commit yarn.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Add/update yarn.lock"
          file_pattern: yarn.lock
          push_options: '--force-with-lease'

      # 构建项目
      - name: Build project
        run: yarn build

      # 上传构建产物 (供后续 Release Job 下载)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with
          name: webui-dist
          path: dist/
          # 确保产物在 1 天后过期
          retention-days: 1

  # 自动发行 Job
  release:
    # 仅在 push 事件或手动触发时运行 Release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    
    # 依赖于 build Job
    needs: build
    runs-on: ubuntu-24.04

    # 授权：允许工作流创建 Release
    permissions:
      contents: write

    steps:
      # 1. 下载构建产物
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: dist/

      # 2. 确定 Tag 名称
      - name: Determine Tag Name
        id: tag_name
        run: |
          # 如果是手动触发，使用用户输入的 tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          # 如果是 push 触发，使用当前时间戳或版本号 (这里使用时间戳作为示例)
          else
            # 假设您希望使用 package.json 中的版本号作为 Tag
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION-${{ github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # 3. 创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          # 使用确定的 Tag 名称
          tag_name: ${{ steps.tag_name.outputs.tag }}
          name: Release ${{ steps.tag_name.outputs.tag }}
          body: |
            Automated release from branch ${{ github.ref_name }}.
          draft: false
          prerelease: false
          # 将 dist 目录下的所有文件作为附件上传
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}