name: Build, TypeScript Check & Release

on:
  push:
    branches:
      - fuse-ui-miuix
  pull_request:
    branches:
      - fuse-ui-miuix
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的仓库分支 (The branch to build)'
        required: true
        default: 'fuse-ui-miuix'
        type: string

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.branch) || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build project (Parcel)
        run: yarn build

      - name: Archive production artifacts
        run: zip -r webui-dist.zip dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist-archive
          path: webui-dist.zip
          retention-days: 1

  release:
    if: github.event_name == 'push'
    needs: typecheck
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webui-dist-archive

      - name: Get current date for tag
        id: date
        run: echo "RELEASE_TAG=v$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.RELEASE_TAG }}
          name: WebUI Release ${{ steps.date.outputs.RELEASE_TAG }}
          body: |
            Automated release of the WebUI build.

            Changes:
            - TypeScript type check passed
            - Latest build artifacts included.
          draft: false
          prerelease: false
          files: webui-dist.zip
