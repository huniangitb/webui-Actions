name: Build and Maintain yarn.lock

# 触发工作流的事件
on:
  # 1. 当代码推送到 main 或 develop 分支时自动触发
  push:
    branches:
      - clean

  # 2. 当有 Pull Request 指向 main 分支时自动触发
  pull_request:
    branches:
      - main

  # 3. 保留手动触发功能
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的仓库分支 (The branch to build)'
        required: true
        default: 'main' # 默认使用 main 分支
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    # 新增：为工作流授权，允许它将代码推送回仓库
    permissions:
      contents: write

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 动态决定检出哪个分支：
          # - 如果是手动触发(workflow_dispatch)，使用用户输入的分支。
          # - 如果是自动触发(push/pull_request)，使用事件对应的分支 (github.ref)。
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.branch) || github.ref }}

      # 设置 Node.js 环境，这里不使用缓存
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装依赖。这一步会自动创建 yarn.lock 文件
      - name: Install dependencies
        # 注意：这里不能使用 --frozen-lockfile，因为它要求 lock 文件必须存在且最新
        run: yarn install
            & yarn add vconsole

      # 新增：检查 yarn.lock 文件是否有变动，如果有则自动提交
      - name: Commit yarn.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Add/update yarn.lock"
          # 仅追踪 yarn.lock 文件的变化
          file_pattern: yarn.lock
          # 将代码推送到当前检出的分支
          push_options: '--force-with-lease' # 使用更安全的推送方式

      - name: Build project
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: dist/
