name: Build WebUI

# 仅在手动触发时运行
on:
  workflow_dispatch:
    # 添加输入参数，用于在手动触发时选择分支
    inputs:
      branch:
        description: '要构建的仓库分支 (The branch to build)'
        required: true
        default: 'main' # 默认使用 main 分支
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 检出代码时，使用手动输入的分支
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 使用 github.event.inputs.branch 来获取用户输入的分支名
          ref: ${{ github.event.inputs.branch }}

      # 设置 Node.js 环境，并启用 yarn 缓存
      - name: Set up Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 新增：为 yarn 启用缓存。
          # action 会自动根据 yarn.lock 文件生成缓存的 key。
          # 当 yarn.lock 没有变化时，它会恢复缓存，从而跳过大部分下载过程。
          cache: 'yarn'

      - name: Install dependencies
        # 如果缓存命中，这一步会非常快
        run: yarn install

      - name: Build project
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: dist/
