name: Build WebUI

# 触发工作流的事件
on:
  # 1. 当代码推送到 main 或 develop 分支时自动触发
  push:
    branches:
      - test2

  # 2. 当有 Pull Request 指向 main 分支时自动触发
  pull_request:
    branches:
      - main

  # 3. 保留手动触发功能
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的仓库分支 (The branch to build)'
        required: true
        default: 'test2' # 默认使用 main 分支
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    # 移除 permissions: contents: write，因为不再需要写入权限来提交 yarn.lock

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 动态决定检出哪个分支：
          # - 如果是手动触发(workflow_dispatch)，使用用户输入的分支。
          # - 如果是自动触发(push/pull_request)，使用事件对应的分支 (github.ref)。
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.branch) || github.ref }}

      # 设置 Node.js 环境，并启用基于 yarn.lock 的缓存
      - name: Set up Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 因为仓库中已有 yarn.lock，这是最推荐的缓存方式。
          # 它会根据 yarn.lock 文件的哈希值来创建和恢复缓存。
          cache: 'yarn' # 启用 yarn 缓存

      - name: Install dependencies
        # 如果缓存命中，这一步会非常快
        # 由于 yarn.lock 文件现在已存在并被追踪，可以使用 --frozen-lockfile 确保严格安装
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: dist/
