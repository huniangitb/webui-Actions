<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑 - Cleaner 管理面板</title>
    <link href="edit.scss" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">编辑中心</h1>

        <!-- 规则文件编辑卡片 -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">规则文件编辑</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-3">
                    <button id="edit-blacklist1" class="btn btn-primary" data-mdb-ripple-init data-mdb-ripple-color="light">编辑黑名单</button>
                    <button id="edit-blacklist2" class="btn btn-primary" data-mdb-ripple-init data-mdb-ripple-color="light">过期文件黑名单</button>
                    <button id="edit-whitelist" class="btn btn-primary" data-mdb-ripple-init data-mdb-ripple-color="light">编辑白名单</button>
                </div>
            </div>
        </div>

        <!-- 配置文件编辑卡片 -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">配置文件编辑</h5>
            </div>
            <div class="card-body">
                <form id="config-form">
                    <div class="mb-3">
                        <label for="retention-days" class="form-label">保留天数 (黑名单2)</label>
                        <input type="number" class="form-control" id="retention-days" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">调度模式</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="schedule-mode" id="schedule-mode-interval" value="interval" checked>
                                <label class="form-check-label" for="schedule-mode-interval">秒数间隔</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="schedule-mode" id="schedule-mode-cron" value="cron">
                                <label class="form-check-label" for="schedule-mode-cron">Cron 表达式</label>
                            </div>
                        </div>
                    </div>
                    <div id="interval-input-group" class="mb-3 schedule-input-group">
                        <label for="clean-interval" class="form-label">程序清理间隔 (秒)</label>
                        <input type="number" class="form-control" id="clean-interval" required>
                    </div>
                    <div id="cron-input-group" class="mb-3 schedule-input-group hidden">
                        <label for="cron-expression" class="form-label">Cron 表达式</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="cron-expression" readonly placeholder="点击编辑按钮进行设置">
                            <button class="btn btn-outline-primary" type="button" id="edit-cron-btn" data-mdb-ripple-init data-mdb-ripple-color="dark">编辑</button>
                        </div>
                    </div>
                    <div id="f2fs-gc-config-container" class="mb-3" style="display: none;">
                        <label class="form-label">开机自动GC (F2FS)</label>
                        <div>
                            <input type="checkbox" id="f2fs-gc-config-toggle" class="btn-check" autocomplete="off">
                            <label id="f2fs-gc-config-toggle-label" class="btn btn-outline-secondary" for="f2fs-gc-config-toggle" data-mdb-ripple-init>关闭</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success" data-mdb-ripple-init data-mdb-ripple-color="light">保存并重启模块</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="bi bi-house-door fa-lg"></i>
            <span>主页</span>
        </a>
        <a href="edit.html" class="nav-item active">
            <i class="bi bi-pencil-square fa-lg"></i>
            <span>编辑</span>
        </a>
    </nav>

    <!-- Cron 编辑器模态框 -->
    <div class="modal fade" id="cron-editor-modal" tabindex="-1" aria-labelledby="cronEditorModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cronEditorModalLabel">图形化 Cron 编辑器</h5>
                    <button type="button" class="btn-close" data-mdb-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <ul class="nav nav-pills nav-fill mb-3" id="cron-tabs" role="tablist">
                        <li class="nav-item" role="presentation"><a class="nav-link active" data-mdb-toggle="pill" href="#cron-minutes" role="tab">分钟</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-hours" role="tab">小时</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-dom" role="tab">日</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-months" role="tab">月</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-dow" role="tab">星期</a></li>
                    </ul>
                    <div class="tab-content" id="cron-tabs-content">
                        <div class="tab-pane fade show active" id="cron-minutes" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-hours" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-dom" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-months" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-dow" role="tabpanel"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-cron-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="edit.js"></script>
</body>
</html>
