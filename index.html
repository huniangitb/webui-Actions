<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner 管理面板</title>
    <!-- ParcelJS 会将 SCSS 文件编译并链接到这里 -->
    <link href="styles.scss" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Cleaner 管理面板</h1>

        <!-- 日志数据统计卡片 -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">日志数据统计</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="date-select" class="form-label">选择日期：</label>
                    <input type="date" id="date-select" class="form-control" min="" max="">
                </div>
                <div class="mb-4" style="position: relative; height: 300px;">
                    <canvas id="bar-chart"></canvas>
                </div>
                
                <div id="app-stats-container" class="mt-4">
                    <h5 id="app-stats-title" class="mb-3">应用清理详情</h5>
                    <div class="app-stats-list-wrapper">
                        <ul id="app-stats-list" class="list-group list-group-flush">
                            <!-- JS 会动态填充这里 -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- F2FS & 控制中心卡片 -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">控制中心</h5>
            </div>
            <div class="card-body">
                <!-- F2FS GC 信息 -->
                <div id="f2fs-gc-info-container" class="mb-3" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <p class="mb-0 fw-bold">F2FS 垃圾回收</p>
                        <button id="gc-control-btn" class="btn btn-sm btn-outline-secondary" data-mdb-ripple-init>状态未知</button>
                    </div>
                    <div class="text-center mb-2">
                        <span id="gc-status" class="badge bg-secondary" style="padding: 0.5em; line-height: 1.2;">未知</span>
                    </div>
                    <div class="mx-auto" style="position: relative; height: 150px; max-width: 150px;">
                        <canvas id="segment-chart"></canvas>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="d-flex justify-content-center flex-wrap gap-2">
                    <button id="clean-now-btn" class="btn btn-primary btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">立即<br>清理</button>
                    <button id="refresh-log" class="btn btn-primary btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">刷新<br>数据</button>
                    <button id="delete-log" class="btn btn-danger btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">删除<br>日志</button>
                    <button id="clear-data" class="btn btn-warning btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">清除<br>缓存</button>
                    <button id="restart-module" class="btn btn-info btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">重启<br>模块</button>
                </div>
            </div>
        </div>

        <!-- 规则文件编辑卡片 -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">规则文件编辑</h5>
            </div>
            <div class="card-body">
                <div class="d-grid gap-3">
                    <button id="edit-blacklist1" class="btn btn-primary" data-mdb-ripple-init data-mdb-ripple-color="light">编辑黑名单</button>
                    <button id="edit-blacklist2" class="btn btn-primary" data-mdb-ripple-init data-mdb-ripple-color="light">过期文件黑名单</button>
                    <button id="edit-whitelist" class="btn btn-primary" data-mdb-ripple-init data-mdb-ripple-color="light">编辑白名单</button>
                </div>
            </div>
        </div>

        <!-- 配置文件编辑卡片 -->
        <div class="card mt-4 mb-5">
            <div class="card-header">
                <h5 class="mb-0">配置文件编辑</h5>
            </div>
            <div class="card-body">
                <form id="config-form">
                    <div class="mb-3">
                        <label for="retention-days" class="form-label">保留天数 (黑名单2)</label>
                        <input type="number" class="form-control" id="retention-days" required>
                    </div>
                    <div class="mb-3">
                        <label for="clean-interval" class="form-label">程序清理间隔 (秒)</label>
                        <input type="number" class="form-control" id="clean-interval" required>
                    </div>
                    <div id="f2fs-gc-config-container" class="mb-3" style="display: none;">
                        <label class="form-label">开机自动GC (F2FS)</label>
                        <div>
                            <input type="checkbox" id="f2fs-gc-config-toggle" class="btn-check" autocomplete="off">
                            <label id="f2fs-gc-config-toggle-label" class="btn btn-outline-secondary" for="f2fs-gc-config-toggle" data-mdb-ripple-init>关闭</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success" data-mdb-ripple-init data-mdb-ripple-color="light">保存并重启模块</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ParcelJS 会处理这个模块脚本的依赖 -->
    <script type="module" src="scripts.js"></script>
</body>
</html>
