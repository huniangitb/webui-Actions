<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="main.scss">
</head>
<body>
    <div class="container mt-4 mb-5">
        <header class="text-center mb-4">
            <h1 data-i18n="title"></h1>
            <p class="text-muted" data-i18n="subtitle.simplified"></p>
        </header>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title" data-i18n="status.cardTitle"></h5>
                <p class="mb-1"><span data-i18n="status.refreshRate"></span> <span id="refreshRateValue" class="badge bg-primary" data-i18n="status.reading"></span></p>
                <label for="brightnessSlider" class="form-label mt-2" data-i18n="status.brightness"></label>
                <div class="range"><input type="range" class="form-range" id="brightnessSlider" min="0" max="100" step="1" disabled /></div>
                <div id="brightnessValue" class="form-text" data-i18n="status.reading"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0" data-i18n="calibration.title"></h5>
                    <div>
                        <button id="resetButton" type="button" class="btn btn-warning btn-sm" data-mdb-ripple-init data-i18n="buttons.reset"></button>
                        <button id="saveButton" type="button" class="btn btn-primary btn-sm" data-mdb-ripple-init data-i18n="buttons.save"></button>
                    </div>
                </div>
                
                <p class="text-muted small" data-i18n="calibration.description"></p>

                <div class="calibration-step">
                    <p><strong data-i18n="calibration.step1.title"></strong></p>
                    <p class="text-muted small" data-i18n="calibration.step1.description"></p>
                    <button id="setLowPointButton" class="btn btn-secondary" data-mdb-ripple-init data-i18n="calibration.step1.button"></button>
                    <span id="lowPointStatus" class="ms-3 text-muted small"></span>
                </div>
                <hr/>
                <div class="calibration-step">
                    <p><strong data-i18n="calibration.step2.title"></strong></p>
                    <p class="text-muted small" data-i18n="calibration.step2.description"></p>
                    <button id="setHighPointButton" class="btn btn-secondary" data-mdb-ripple-init data-i18n="calibration.step2.button"></button>
                    <span id="highPointStatus" class="ms-3 text-muted small"></span>
                </div>
                <hr/>

                <div class="chart-container mt-4">
                    <canvas id="colorCurveChart"></canvas>
                </div>
            </div>
        </div>
        <footer class="text-center mt-4">
            <p class="text-muted small" data-i18n="footer.author"></p>
        </footer>
    </div>
    
    <!-- 校准模态框 -->
    <div class="modal fade" id="calibrationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="calibrationModalTitle"></h5><button type="button" class="btn-close" data-mdb-dismiss="modal"></button></div>
                <div class="modal-body">
                    <p id="calibrationModalDescription"></p>
                    <label for="colorOffsetSlider" class="form-label" data-i18n="calibration.offsetLabel"></label>
                    <div class="range"><input type="range" class="form-range" id="colorOffsetSlider" min="-50" max="50" step="1" value="0" /></div>
                    <div class="text-center" id="colorOffsetValue">0</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal" data-i18n="modals.range.cancel"></button>
                    <button type="button" id="confirmCalibrationButton" class="btn btn-primary" data-mdb-ripple-init data-i18n="calibration.confirmButton"></button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
