<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Namespace Proxy</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div class="container-fluid px-0 px-md-3 py-3" style="max-width: 800px; margin: 0 auto;">
        <!-- 头部 -->
        <div class="d-flex justify-content-between align-items-center mb-3 px-3">
            <div>
                <h5 class="mb-0 text-primary fw-bold">NAMESPACE PROXY</h5>
                <div class="d-flex align-items-center">
                    <span class="badge badge-success me-2" id="statusBadge">...</span>
                    <small id="statusInfo" class="text-muted font-monospace small">Checking</small>
                </div>
            </div>
            <button id="btnReload" class="btn btn-warning btn-floating shadow-0"><i class="fas fa-sync"></i></button>
        </div>

        <!-- 导航 -->
        <ul class="nav nav-pills nav-fill mb-3 shadow-0 bg-white rounded mx-3 p-1" role="tablist">
            <li class="nav-item"><a class="nav-link active rounded-5" href="#content-apps">应用绑定</a></li>
            <li class="nav-item"><a class="nav-link rounded-5" href="#content-envs">环境管理</a></li>
            <li class="nav-item"><a class="nav-link rounded-5" href="#content-io">监控</a></li>
            <li class="nav-item"><a class="nav-link rounded-5" href="#content-log">日志</a></li>
        </ul>

        <div class="tab-content px-3">
            <!-- 1. 应用绑定列表 -->
            <div class="tab-pane fade show active" id="content-apps">
                <div class="card shadow-0 border">
                    <div class="card-body p-2">
                        <div class="input-group mb-3 border rounded bg-white">
                            <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                            <input type="text" id="appSearch" class="form-control border-0 shadow-none" placeholder="搜索应用名称或包名..." />
                        </div>
                        <div class="d-flex gap-2 mb-3 overflow-auto pb-1 no-scrollbar">
                            <input type="radio" class="btn-check" name="appFilter" id="filterUser" checked />
                            <label class="btn btn-sm btn-outline-primary rounded-pill flex-shrink-0" for="filterUser">用户应用</label>
                            <input type="radio" class="btn-check" name="appFilter" id="filterSystem" />
                            <label class="btn btn-sm btn-outline-primary rounded-pill flex-shrink-0" for="filterSystem">系统应用</label>
                            <input type="radio" class="btn-check" name="appFilter" id="filterBound" />
                            <label class="btn btn-sm btn-outline-primary rounded-pill flex-shrink-0" for="filterBound">已绑定</label>
                        </div>
                        <div id="appList" class="list-group list-group-light border-0" style="min-height: 300px;"></div>
                    </div>
                </div>
            </div>

            <!-- 2. 环境管理 -->
            <div class="tab-pane fade" id="content-envs">
                <div class="card shadow-0 border">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="mb-0 fw-bold">环境列表 (Environments)</h6>
                            <button id="btnNewEnv" class="btn btn-primary btn-sm btn-rounded shadow-0"><i class="fas fa-plus me-1"></i>新建</button>
                        </div>
                        <div id="envList" class="row g-2"></div>
                    </div>
                </div>
            </div>

            <!-- 3. 监控 -->
            <div class="tab-pane fade" id="content-io">
                <div class="card shadow-0 bg-white border"><div class="card-body p-2">
                    <div class="input-group mb-2 border rounded">
                         <span class="input-group-text border-0 bg-transparent py-1"><i class="fas fa-search text-muted small"></i></span>
                        <input type="text" id="ioSearch" class="form-control form-control-sm border-0 shadow-none" placeholder="搜索操作记录..." />
                    </div>
                    <div class="table-responsive border rounded" style="height: 500px;">
                        <table class="table table-sm table-hover text-nowrap align-middle mb-0">
                            <thead class="table-light sticky-top"><tr><th>时间</th><th>应用</th><th>操作</th><th>详情</th></tr></thead>
                            <tbody id="ioTableBody" class="font-monospace" style="font-size: 11px;"></tbody>
                        </table>
                    </div>
                </div></div>
            </div>

            <!-- 4. 日志 -->
            <div class="tab-pane fade" id="content-log">
                <div class="card shadow-0 bg-white border"><div class="card-body p-2">
                    <select id="logFileSelect" class="form-select form-select-sm mb-2 font-monospace bg-light"></select>
                    <div id="logViewer" class="rounded font-monospace p-3 bg-dark text-light" style="height: 500px; overflow: auto; font-size: 11px;"></div>
                </div></div>
            </div>
        </div>
    </div>

    <!-- 模态框：应用绑定配置 -->
    <div class="modal fade" id="appConfigModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold">应用绑定</h5>
                <button type="button" class="btn-close" data-mdb-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex align-items-center mb-4">
                    <div id="bindAppIcon" class="me-3" style="width: 48px; height: 48px;"></div>
                    <div>
                        <div class="fw-bold" id="bindAppName">App Name</div>
                        <small class="text-muted font-monospace" id="bindAppPkg">com.pkg</small>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">选择环境</label>
                    <select id="bindEnvSelect" class="form-select"><option value="">未绑定 (默认)</option></select>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted fw-bold">运行模式</label>
                    <div class="btn-group w-100 shadow-0 mode-selector" role="group">
                        <input type="radio" class="btn-check" name="bindMode" id="modeDefault" value="" checked>
                        <label class="btn btn-outline-secondary" for="modeDefault">默认</label>
                        <input type="radio" class="btn-check" name="bindMode" id="modeMonitor" value="MONITOR">
                        <label class="btn btn-outline-warning" for="modeMonitor">监控</label>
                        <input type="radio" class="btn-check" name="bindMode" id="modePassthrough" value="PASSTHROUGH">
                        <label class="btn btn-outline-danger" for="modePassthrough">直通</label>
                    </div>
                    <div class="form-text small mt-2 text-muted"><i class="fas fa-info-circle me-1"></i> <span id="modeDesc">默认：规则生效。监控：仅记录。直通：忽略规则。</span></div>
                </div>
            </div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-primary w-100 shadow-0" id="btnSaveBinding">保存绑定</button>
            </div>
        </div></div>
    </div>

    <!-- 模态框：新建环境 -->
    <div class="modal fade" id="newEnvModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered"><div class="modal-content border-0">
            <div class="modal-body">
                <h6 class="fw-bold mb-3">新建环境</h6>
                <div class="form-outline border rounded mb-3">
                    <input type="text" id="newEnvName" class="form-control" placeholder="例如: GameScope" />
                </div>
                <button id="btnCreateEnv" class="btn btn-primary w-100 shadow-0">创建</button>
            </div>
        </div></div>
    </div>

    <!-- 模态框：环境规则编辑 -->
    <div class="modal fade" id="envEditorModal" tabindex="-1" data-mdb-backdrop="static">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0" style="height: 85vh;">
                <div class="modal-header bg-light border-bottom-0 py-2">
                    <div>
                        <h5 class="modal-title fw-bold"><i class="fas fa-layer-group me-2"></i><span id="editorEnvName">Env</span></h5>
                        <small class="text-muted">环境规则配置</small>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                         <div class="btn-group shadow-0 btn-group-sm">
                            <input type="radio" class="btn-check" name="editorMode" id="modeVisual" value="visual" checked />
                            <label class="btn btn-outline-secondary" for="modeVisual">图形</label>
                            <input type="radio" class="btn-check" name="editorMode" id="modeRaw" value="raw" />
                            <label class="btn btn-outline-secondary" for="modeRaw">源码</label>
                        </div>
                        <button type="button" class="btn-close ms-2" data-mdb-dismiss="modal"></button>
                    </div>
                </div>
                <div class="modal-body bg-light p-0 position-relative">
                    <!-- 自动补全建议框 -->
                    <div id="suggestionBox" class="list-group shadow-lg position-absolute" style="display:none; z-index: 1050; max-height: 250px; overflow-y: auto;"></div>

                    <div id="editorVisual" class="p-3 h-100 overflow-auto">
                        <div class="alert alert-info py-2 small mb-3">
                            <i class="fas fa-info-circle me-1"></i> 
                            <b>重定向至</b>: 输入 <b>/</b> 开头为绝对路径，否则自动映射到 <b>/data/media/0/</b>。
                        </div>
                        <div id="ruleBuilderContainer" style="padding-bottom: 250px;"></div>
                        <button id="btnAddRuleRow" class="btn btn-outline-primary btn-sm btn-rounded shadow-0 mt-2 w-100 border-dashed"><i class="fas fa-plus"></i> 添加规则</button>
                    </div>
                    <div id="editorRaw" class="h-100 d-none">
                        <textarea class="form-control font-monospace border-0 h-100 bg-dark text-light raw-editor-padding" id="envRuleContent" style="resize: none;"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top-0 py-2">
                    <button id="btnDeleteEnv" class="btn btn-outline-danger btn-sm shadow-0 me-auto">删除环境</button>
                    <button id="btnSaveEnv" class="btn btn-primary shadow-0 px-4">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
