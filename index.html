<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner 管理面板</title>
    <link href="styles.scss" rel="stylesheet">
</head>
<body>
    <!-- 加载动画 -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- 应用主容器，默认隐藏 -->
    <div class="app-wrapper">
        <div class="pages-container">
            <!-- 主页内容 -->
            <main id="page-home">
                <div class="container mt-5">
                    <!-- 移除边距类，交由 CSS 控制 -->
                    <h1 class="text-center">Cleaner 管理面板</h1>
                    <!-- 日志数据统计卡片 -->
                    <div class="card">
                        <div class="card-header"><h5 class="mb-0">日志数据统计</h5></div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="date-select" class="form-label">选择日期：</label>
                                <!-- 新增: 毛玻璃包裹层 -->
                                <div class="input-glass-wrapper">
                                    <input type="date" id="date-select" class="form-control-transparent" min="" max="">
                                </div>
                            </div>
                            <div id="bar-chart-wrapper" class="mb-4"><canvas id="bar-chart"></canvas></div>
                            <div id="app-stats-container" class="mt-4">
                                <h5 id="app-stats-title" class="mb-3">应用清理详情</h5>
                                <div class="app-stats-list-wrapper"><ul id="app-stats-list" class="list-group list-group-flush"></ul></div>
                            </div>
                        </div>
                    </div>
                    <!-- 控制中心卡片 -->
                    <div class="card mt-4">
                        <div class="card-header"><h5 class="mb-0">控制中心</h5></div>
                        <div class="card-body">
                            <div id="f2fs-gc-info-container" class="mb-3" style="display: none;">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <p class="mb-0 fw-bold">F2FS 垃圾回收</p>
                                    <button id="customize-partitions-btn" class="btn btn-sm btn-outline-secondary" data-mdb-ripple-init style="display: none;">自定义</button>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span id="global-gc-status" class="badge bg-secondary" style="padding: 0.5em; line-height: 1.2;">未知</span>
                                    <button id="gc-control-btn" class="btn btn-sm btn-outline-secondary" data-mdb-ripple-init>状态未知</button>
                                </div>
                                <div id="partition-gc-status-container" class="d-flex flex-wrap justify-content-center gap-2 mb-1"></div>
                                <div id="f2fs-charts-container" class="d-flex flex-wrap justify-content-center gap-3 mt-1"></div>
                            </div>
                            <div class="actions-container">
                                <button id="clean-now-btn" class="btn btn-primary btn-sm" data-mdb-ripple-init>立即<br>清理</button>
                                <button id="refresh-log" class="btn btn-primary btn-sm" data-mdb-ripple-init>刷新<br>数据</button>
                                <button id="delete-log" class="btn btn-danger btn-sm" data-mdb-ripple-init>删除<br>日志</button>
                                <button id="clear-data" class="btn btn-warning btn-sm" data-mdb-ripple-init>清除<br>缓存</button>
                                <button id="restart-module" class="btn btn-info btn-sm" data-mdb-ripple-init>重启<br>模块</button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- 编辑页内容 -->
            <main id="page-edit">
                <div class="container mt-5">
                    <!-- 移除边距类，交由 CSS 控制 -->
                    <h1 class="text-center">编辑中心</h1>
                    <!-- 规则文件编辑卡片 -->
                    <div class="card mt-4">
                        <div class="card-header"><h5 class="mb-0">规则文件编辑</h5></div>
                        <div class="card-body">
                            <div class="d-grid gap-3">
                                <button id="edit-blacklist1" class="btn btn-primary" data-mdb-ripple-init>编辑黑名单</button>
                                <button id="edit-blacklist2" class="btn btn-primary" data-mdb-ripple-init>过期文件黑名单</button>
                                <button id="edit-whitelist" class="btn btn-primary" data-mdb-ripple-init>编辑白名单</button>
                            </div>
                        </div>
                    </div>
                    <!-- 配置文件编辑卡片 -->
                    <div class="card mt-4">
                        <div class="card-header"><h5 class="mb-0">配置文件编辑</h5></div>
                        <div class="card-body">
                            <form id="config-form">
                                <div class="mb-3">
                                    <label for="retention-days" class="form-label">保留天数 (黑名单2)</label>
                                    <div class="input-glass-wrapper">
                                        <input type="number" class="form-control-transparent" id="retention-days" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">调度模式</label>
                                    <!-- 新增: 调度模式的分段控件结构 -->
                                    <div class="radio-toggle-group">
                                        <input class="radio-toggle-input" type="radio" name="schedule-mode" id="schedule-mode-interval" value="interval" checked>
                                        <label class="radio-toggle-label" for="schedule-mode-interval">秒数间隔</label>
                                        
                                        <input class="radio-toggle-input" type="radio" name="schedule-mode" id="schedule-mode-cron" value="cron">
                                        <label class="radio-toggle-label" for="schedule-mode-cron">Cron 表达式</label>
                                    </div>
                                </div>
                                <div id="interval-input-group" class="mb-3 schedule-input-group">
                                    <label for="clean-interval" class="form-label">程序清理间隔 (秒)</label>
                                    <div class="input-glass-wrapper">
                                        <input type="number" class="form-control-transparent" id="clean-interval" required>
                                    </div>
                                </div>
                                <div id="cron-input-group" class="mb-3 schedule-input-group hidden">
                                    <label for="cron-expression" class="form-label">Cron 表达式</label>
                                    <div class="input-group input-glass-wrapper">
                                        <input type="text" class="form-control-transparent" id="cron-expression" readonly placeholder="点击编辑按钮进行设置">
                                        <button class="btn btn-outline-primary" type="button" id="edit-cron-btn" data-mdb-ripple-init>编辑</button>
                                    </div>
                                </div>
                                <div id="f2fs-gc-config-container" class="mb-3" style="display: none;">
                                    <label class="form-label">开机自动GC (F2FS)</label>
                                    <div>
                                        <input type="checkbox" id="f2fs-gc-config-toggle" class="btn-check" autocomplete="off">
                                        <label id="f2fs-gc-config-toggle-label" class="btn btn-outline-secondary" for="f2fs-gc-config-toggle" data-mdb-ripple-init>关闭</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success" data-mdb-ripple-init>保存并重启模块</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- 移入: 将导航栏放入 app-wrapper 内部以修复模糊层级问题 -->
        <nav class="bottom-nav">
            <a href="#home" class="nav-item active" data-page="home">
                <svg class="nav-icon" viewBox="0 0 24 24"><path data-icon="home"></path></svg>
                <span>主页</span>
            </a>
            <a href="#edit" class="nav-item" data-page="edit">
                <svg class="nav-icon" viewBox="0 0 24 24"><path data-icon="edit"></path></svg>
                <span>编辑</span>
            </a>
        </nav>
    </div>

    <!-- 所有模态框 (统一放置) -->
    <!-- 自定义分区显示模态框 -->
    <div class="modal fade" id="partitions-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">自定义分区显示</h5><button type="button" class="btn-close" data-mdb-dismiss="modal"></button></div>
                <div class="modal-body" id="partitions-modal-body"></div>
                <div class="modal-footer"><button type="button" class="btn btn-primary" id="save-partitions-btn">保存</button></div>
            </div>
        </div>
    </div>
    <!-- Cron 编辑器模态框 -->
    <div class="modal fade" id="cron-editor-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">图形化 Cron 编辑器</h5><button type="button" class="btn-close" data-mdb-dismiss="modal"></button></div>
                <div class="modal-body">
                    <ul class="nav nav-pills nav-fill mb-3" id="cron-tabs" role="tablist">
                        <li class="nav-item" role="presentation"><a class="nav-link active" data-mdb-toggle="pill" href="#cron-minutes" role="tab">分钟</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-hours" role="tab">小时</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-dom" role="tab">日</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-months" role="tab">月</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-mdb-toggle="pill" href="#cron-dow" role="tab">星期</a></li>
                    </ul>
                    <div class="tab-content" id="cron-tabs-content">
                        <div class="tab-pane fade show active" id="cron-minutes" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-hours" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-dom" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-months" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-dow" role="tabpanel"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-mdb-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-cron-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
