<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Namespace Proxy</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div class="container py-3">
        <!-- 头部状态栏 -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <div>
                <h4 class="mb-0 text-primary fw-bold">NAMESPACE PROXY</h4>
                <div class="d-flex align-items-center">
                    <span class="badge badge-success me-2" id="statusBadge">...</span>
                    <small id="statusInfo" class="text-muted font-monospace small">Checking</small>
                </div>
            </div>
            <button id="btnReload" class="btn btn-warning btn-floating shadow-0"><i class="fas fa-sync"></i></button>
        </div>

        <!-- 导航栏 -->
        <ul class="nav nav-tabs mb-3 shadow-0 bg-white rounded px-2" role="tablist">
            <li class="nav-item"><a class="nav-link active" href="#content-apps">环境配置</a></li>
            <li class="nav-item"><a class="nav-link" href="#content-global">全局设置</a></li>
            <li class="nav-item"><a class="nav-link" href="#content-io">文件监控</a></li>
            <li class="nav-item"><a class="nav-link" href="#content-log">运行日志</a></li>
        </ul>

        <div class="tab-content">
            <!-- 1. 环境配置 (应用列表) -->
            <div class="tab-pane fade show active" id="content-apps">
                <div class="card shadow-0 border">
                    <div class="card-body p-3">
                        <!-- 筛选工具栏 -->
                        <div class="d-flex gap-2 mb-3">
                            <div class="flex-grow-1 form-outline border rounded bg-white">
                                <input type="text" id="appSearch" class="form-control" />
                                <label class="form-label">搜索应用或包名...</label>
                            </div>
                            <div class="btn-group shadow-0">
                                <input type="radio" class="btn-check" name="appFilter" id="filterUser" autocomplete="off" checked />
                                <label class="btn btn-outline-primary" for="filterUser">用户</label>
                                
                                <input type="radio" class="btn-check" name="appFilter" id="filterSystem" autocomplete="off" />
                                <label class="btn btn-outline-primary" for="filterSystem">系统</label>
                                
                                <input type="radio" class="btn-check" name="appFilter" id="filterConfigured" autocomplete="off" />
                                <label class="btn btn-outline-primary" for="filterConfigured">已配置</label>
                            </div>
                        </div>
                        <!-- 应用列表容器 -->
                        <div id="appList" class="list-group list-group-light border-0" style="min-height: 300px;">
                            <div class="text-center p-5 text-muted"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. 全局设置 -->
            <div class="tab-pane fade" id="content-global">
                <div class="card shadow-0 border">
                    <div class="card-header bg-white"><h6 class="mb-0 fw-bold text-primary">全局注入脚本 (injector.conf)</h6></div>
                    <div class="card-body">
                        <textarea class="form-control font-monospace border bg-light mb-3" id="mainConfig" rows="15" style="resize: none;" placeholder="# 全局通用规则..."></textarea>
                        <div class="text-end"><button id="btnSaveMain" class="btn btn-primary shadow-0"><i class="fas fa-save me-1"></i>保存全局配置</button></div>
                    </div>
                </div>
            </div>

            <!-- 3. 文件监控 -->
            <div class="tab-pane fade" id="content-io">
                <div class="card shadow-0 bg-white border"><div class="card-body">
                    <div class="form-outline mb-3 border rounded"><input type="text" id="ioSearch" class="form-control" /><label class="form-label">搜索日志...</label></div>
                    <div class="table-responsive border" style="height: 500px;">
                        <table class="table table-sm table-hover text-nowrap align-middle">
                            <thead class="table-light sticky-top"><tr><th>时间</th><th>应用</th><th class="text-center">操作</th><th>详情</th></tr></thead>
                            <tbody id="ioTableBody" class="font-monospace"></tbody>
                        </table>
                    </div>
                </div></div>
            </div>

            <!-- 4. 运行日志 -->
            <div class="tab-pane fade" id="content-log">
                <div class="card shadow-0 bg-white border"><div class="card-body">
                    <select id="logFileSelect" class="form-select mb-3 border bg-light shadow-none font-monospace"></select>
                    <div id="logViewer" class="rounded font-monospace"></div>
                </div></div>
            </div>
        </div>
    </div>

    <!-- 规则编辑模态框 -->
    <div class="modal fade" id="ruleModal" tabindex="-1" data-mdb-backdrop="static">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0" style="height: 85vh;">
                <div class="modal-header bg-light border-bottom-0 pb-2">
                    <div class="d-flex align-items-center">
                        <div id="modalAppIconContainer" class="me-3" style="width: 48px; height: 48px;"></div>
                        <div>
                            <h5 class="modal-title fw-bold" id="modalAppName">Application</h5>
                            <div class="d-flex align-items-center gap-2">
                                <small class="text-muted font-monospace" id="modalAppPkg">com.example.app</small>
                                <span class="badge badge-light text-dark border" id="modalAppUid">UID: -</span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                         <div class="btn-group shadow-0 btn-group-sm">
                            <input type="radio" class="btn-check" name="editorMode" id="modeVisual" autocomplete="off" checked />
                            <label class="btn btn-outline-secondary" for="modeVisual">图形模式</label>
                            <input type="radio" class="btn-check" name="editorMode" id="modeRaw" autocomplete="off" />
                            <label class="btn btn-outline-secondary" for="modeRaw">源码模式</label>
                        </div>
                        <button type="button" class="btn-close ms-2" data-mdb-dismiss="modal"></button>
                    </div>
                </div>
                
                <div class="modal-body bg-light p-0">
                    <!-- 图形编辑器 -->
                    <div id="editorVisual" class="p-3 h-100 overflow-auto">
                        <div class="alert alert-info py-2 small mb-3"><i class="fas fa-info-circle me-1"></i> 配置该应用访问文件系统时的重定向或隐藏规则。</div>
                        <div id="ruleBuilderContainer"></div>
                        <button id="btnAddRuleRow" class="btn btn-outline-primary btn-sm btn-rounded shadow-0 mt-2 w-100 border-dashed">
                            <i class="fas fa-plus me-1"></i> 添加规则
                        </button>
                    </div>
                    <!-- 源码编辑器 -->
                    <div id="editorRaw" class="h-100 d-none">
                        <textarea class="form-control font-monospace border-0 h-100 p-3" id="modalRuleContent" style="resize: none; background: #1e1e1e; color: #d4d4d4;"></textarea>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-2">
                    <button id="btnDeleteRule" class="btn btn-danger shadow-0 me-auto"><i class="fas fa-trash me-1"></i> 清除配置</button>
                    <button class="btn btn-light shadow-0" data-mdb-dismiss="modal">取消</button>
                    <button id="btnModalSave" class="btn btn-primary shadow-0 px-4"><i class="fas fa-save me-1"></i> 保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
