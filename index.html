<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>电池监控 Pro</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header>
            <div class="title-group">
                <span class="icon" id="icon-android"></span>
                <h1>电池状态记录</h1>
            </div>
            <div class="action-group">
                <button id="btn-refresh" class="icon-btn" aria-label="刷新"></button>
            </div>
        </header>

        <!-- 周期切换器 (新增) -->
        <div class="cycle-selector">
            <button id="btn-cycle-current" class="cycle-btn active">当前周期</button>
            <button id="btn-cycle-prev" class="cycle-btn">上一周期</button>
        </div>

        <!-- 状态卡片 -->
        <div class="card">
            <div class="card-header">
                <span class="icon" id="icon-battery"></span>
                <h2 id="status-title">当前状态: --</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <label>记录时间</label>
                    <span id="val-time" class="time-text">--</span>
                </div>
                <div class="stat-item">
                    <label>电池电量</label>
                    <span id="val-cap">--%</span>
                </div>
                <div class="stat-item">
                    <label>当前功率</label>
                    <span id="val-power" class="highlight">-- W</span>
                </div>
                <div class="stat-item">
                    <label>充满容量 (校准)</label>
                    <span id="val-full-cap">-- mAh</span>
                </div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="card">
            <div class="card-header">
                <span class="icon" id="icon-chart"></span>
                <h2>功率/电量趋势</h2>
            </div>
            <div class="chart-wrapper">
                <canvas id="batteryChart"></canvas>
            </div>
            <div class="card-footer">
                <small id="data-source-text">数据源: current.csv</small>
                <div class="footer-actions">
                     <span id="status-tag" class="status-tag">未知</span>
                </div>
            </div>
        </div>
        
        <!-- 底部操作区 -->
        <div class="danger-zone">
             <button id="btn-delete" class="text-btn danger">
                <span class="icon-sm" id="icon-delete"></span> 清空所有记录
            </button>
        </div>
    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
