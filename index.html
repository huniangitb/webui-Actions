<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner 管理面板</title>
    <link href="styles.scss" rel="stylesheet">
</head>
<body>
    <div id="loader">
        <div class="spinner-border"></div>
    </div>

    <div class="app-wrapper">
        <div class="main-content-scroll-area">
            <div class="pages-container">
                <main id="page-home">
                    <div class="container">
                        <div class="main-title-wrapper">
                            <h1>Cleaner 管理面板</h1>
                        </div>
                        <div class="card" id="log-stats-card">
                            <div class="card-header"><h5>日志数据统计</h5></div>
                            <div class="card-body">
                                <div class="mb-2">
                                    <label for="date-select" class="form-label">选择日期：</label>
                                    <div class="input-glass-wrapper">
                                        <input type="date" id="date-select" class="form-control-transparent" min="" max="">
                                    </div>
                                </div>
                                <div id="bar-chart-wrapper"><canvas id="bar-chart"></canvas></div>
                                <div id="app-stats-container">
                                    <h5 id="app-stats-title">应用清理详情</h5>
                                    <div class="app-stats-list-wrapper"><ul id="app-stats-list" class="list-group list-group-flush"></ul></div>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5>控制中心</h5>
                                <button id="customize-partitions-btn" class="btn btn-sm btn-outline-secondary" data-toggle="modal" data-target="#partitions-modal" style="display: none;">自定义</button>
                            </div>
                            <div class="card-body control-center-body">
                                <div id="f2fs-gc-info-container" style="display: none;">
                                    <div class="f2fs-interactive-wrapper">
                                        <div class="gc-overlay-controls">
                                            <span id="global-gc-status" class="badge bg-secondary">未知</span>
                                            <button id="gc-control-btn" class="btn btn-sm btn-outline-secondary">状态未知</button>
                                        </div>
                                        <div id="partition-gc-status-container" class="d-flex flex-wrap justify-content-center gap-2"></div>
                                        <div id="f2fs-charts-container"></div>
                                    </div>
                                </div>
                                <div class="actions-container">
                                    <button id="clean-now-btn" class="btn btn-primary btn-sm">立即<br>清理</button>
                                    <button id="refresh-log" class="btn btn-primary btn-sm">刷新<br>数据</button>
                                    <button id="delete-log" class="btn btn-danger btn-sm">删除<br>日志</button>
                                    <button id="clear-data" class="btn btn-warning btn-sm">清除<br>缓存</button>
                                    <button id="restart-module" class="btn btn-info btn-sm">重启<br>模块</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>

                <main id="page-edit">
                    <div class="container">
                        <div class="main-title-wrapper">
                            <h1>编辑中心</h1>
                        </div>
                        <div class="card">
                            <div class="card-header"><h5>规则文件编辑</h5></div>
                            <div class="card-body">
                                <div class="d-grid gap-3">
                                    <button id="edit-blacklist1" class="btn btn-primary">编辑黑名单</button>
                                    <button id="edit-blacklist2" class="btn btn-primary">过期文件黑名单</button>
                                    <button id="edit-whitelist" class="btn btn-primary">编辑白名单</button>
                                </div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header"><h5>配置文件编辑</h5></div>
                            <div class="card-body config-body">
                                <form id="config-form">
                                    <div class="mb-3">
                                        <label for="retention-days" class="form-label">保留天数 (黑名单2)</label>
                                        <div class="input-glass-wrapper">
                                            <input type="number" class="form-control-transparent" id="retention-days" required>
                                        </div>
                                    </div>
                                    <div class="mb-3 mt-3">
                                        <label class="form-label">调度模式</label>
                                        <div class="radio-toggle-group">
                                            <input class="radio-toggle-input" type="radio" name="schedule-mode" id="schedule-mode-interval" value="interval" checked>
                                            <label class="radio-toggle-label" for="schedule-mode-interval">秒数间隔</label>
                                            <input class="radio-toggle-input" type="radio" name="schedule-mode" id="schedule-mode-cron" value="cron">
                                            <label class="radio-toggle-label" for="schedule-mode-cron">Cron 表达式</label>
                                        </div>
                                    </div>
                                    <div id="interval-input-group" class="mb-3 schedule-input-group">
                                        <label for="clean-interval" class="form-label">程序清理间隔 (秒)</label>
                                        <div class="input-glass-wrapper">
                                            <input type="number" class="form-control-transparent" id="clean-interval" required>
                                        </div>
                                    </div>
                                    <div id="cron-input-group" class="mb-3 mt-3 schedule-input-group hidden">
                                        <label for="cron-expression" class="form-label">Cron 表达式</label>
                                        <div class="input-group input-glass-wrapper">
                                            <input type="text" class="form-control-transparent" id="cron-expression" readonly placeholder="点击编辑按钮进行设置">
                                            <button class="btn btn-outline-primary" type="button" id="edit-cron-btn" data-toggle="modal" data-target="#cron-editor-modal">编辑</button>
                                        </div>
                                    </div>
                                    <div id="f2fs-gc-config-container" class="d-flex justify-content-between align-items-center mb-4" style="display: none;">
                                        <label class="form-label mb-0" for="f2fs-gc-config-toggle">开机自动GC (F2FS)</label>
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" role="switch" id="f2fs-gc-config-toggle">
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-success">保存并重启模块</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </main>

                <main id="page-monitor">
                    <div class="container">
                        <div class="main-title-wrapper">
                            <h1>监控中心</h1>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <h5>Fuse IO 实时监控</h5>
                            </div>
                            <div class="card-body p-3">
                                <div id="monitor-setup-container" class="transition-blur">
                                    <div class="input-glass-wrapper" style="margin-bottom: 5px;">
                                        <input type="text" id="monitor-pkg-search" class="form-control-transparent" placeholder="搜索应用名称或包名...">
                                    </div>
                                    <div id="custom-app-list" class="app-picker-list"></div>
                                </div>
                                
                                <div class="mt-3 pt-3 border-top border-secondary">
                                    <div class="d-flex gap-2 mb-3 align-items-center">
                                        <button id="start-monitor-btn" class="btn btn-primary flex-fill" disabled>开始监控并启动</button>
                                        <button id="stop-monitor-btn" class="btn btn-danger flex-fill">关闭应用并停止监控</button>
                                        <div class="form-check form-switch m-0 d-flex align-items-center monitor-hit-switch">
                                            <input class="form-check-input" type="checkbox" id="filter-hits-only">
                                            <label class="form-check-label ms-2" for="filter-hits-only" style="font-size: 0.85rem; white-space: nowrap;">仅命中</label>
                                        </div>
                                        <button id="search-toggle-btn" class="search-toggle-btn" title="搜索路径">
                                            <!-- 放大镜图标 -->
                                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                                                <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <!-- 搜索输入折叠区域 -->
                                    <div id="search-collapse" class="search-collapse">
                                        <div class="input-glass-wrapper mb-3">
                                            <input type="text" id="monitor-log-search" class="form-control-transparent" placeholder="在日志中搜索路径...">
                                        </div>
                                    </div>
                                </div>
                                
                                <div id="monitor-log-output" class="log-output-container"></div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="#home" class="nav-item active" data-page="home" draggable="false">
                <svg class="nav-icon" viewBox="0 0 24 24"><path data-icon="home"></path></svg>
                <span>主页</span>
            </a>
            <a href="#edit" class="nav-item" data-page="edit" draggable="false">
                <svg class="nav-icon" viewBox="0 0 24 24"><path data-icon="edit"></path></svg>
                <span>编辑</span>
            </a>
            <a href="#monitor" class="nav-item" data-page="monitor" draggable="false">
                <svg class="nav-icon" viewBox="0 0 24 24"><path data-icon="monitor"></path></svg>
                <span>监控</span>
            </a>
        </nav>
    </div>

    <!-- Modals -->
    <div class="modal" id="partitions-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">自定义分区显示</h5><button type="button" class="btn-close" data-dismiss="modal"></button></div>
                <div class="modal-body" id="partitions-modal-body"></div>
                <div class="modal-footer"><button type="button" class="btn btn-primary" id="save-partitions-btn">保存</button></div>
            </div>
        </div>
    </div>
    <div class="modal" id="cron-editor-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Cron 编辑器</h5><button type="button" class="btn-close" data-dismiss="modal"></button></div>
                <div class="modal-body">
                    <ul class="nav nav-pills nav-fill mb-3" id="cron-tabs" role="tablist">
                        <li class="nav-item" role="presentation"><a class="nav-link active" data-toggle="pill" href="#cron-minutes" role="tab">分钟</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-toggle="pill" href="#cron-hours" role="tab">小时</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-toggle="pill" href="#cron-dom" role="tab">日</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-toggle="pill" href="#cron-months" role="tab">月</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" data-toggle="pill" href="#cron-dow" role="tab">星期</a></li>
                    </ul>
                    <div class="tab-content" id="cron-tabs-content">
                        <div class="tab-pane fade show active" id="cron-minutes" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-hours" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-dom" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-months" role="tabpanel"></div>
                        <div class="tab-pane fade" id="cron-dow" role="tabpanel"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="save-cron-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
