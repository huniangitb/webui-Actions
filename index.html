<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleaner 管理面板</title>
    <link href="styles.scss" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Cleaner 管理面板</h1>

        <!-- 日志数据统计卡片 -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">日志数据统计</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="date-select" class="form-label">选择日期：</label>
                    <input type="date" id="date-select" class="form-control" min="" max="">
                </div>
                <div id="bar-chart-wrapper" class="mb-4">
                    <canvas id="bar-chart"></canvas>
                </div>
                <div id="app-stats-container" class="mt-4">
                    <h5 id="app-stats-title" class="mb-3">应用清理详情</h5>
                    <div class="app-stats-list-wrapper">
                        <ul id="app-stats-list" class="list-group list-group-flush"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- F2FS & 控制中心卡片 -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">控制中心</h5>
            </div>
            <div class="card-body">
                <div id="f2fs-gc-info-container" class="mb-3" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <p class="mb-0 fw-bold">F2FS 垃圾回收</p>
                        <button id="customize-partitions-btn" class="btn btn-sm btn-outline-secondary" data-mdb-ripple-init style="display: none;">自定义</button>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span id="global-gc-status" class="badge bg-secondary" style="padding: 0.5em; line-height: 1.2;">未知</span>
                        <button id="gc-control-btn" class="btn btn-sm btn-outline-secondary" data-mdb-ripple-init>状态未知</button>
                    </div>
                    <div id="partition-gc-status-container" class="d-flex flex-wrap justify-content-center gap-2 mb-1"></div>
                    <div id="f2fs-charts-container" class="d-flex flex-wrap justify-content-center gap-3 mt-1"></div>
                </div>
                <div class="actions-container">
                    <button id="clean-now-btn" class="btn btn-primary btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">立即<br>清理</button>
                    <button id="refresh-log" class="btn btn-primary btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">刷新<br>数据</button>
                    <button id="delete-log" class="btn btn-danger btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">删除<br>日志</button>
                    <button id="clear-data" class="btn btn-warning btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">清除<br>缓存</button>
                    <button id="restart-module" class="btn btn-info btn-sm" data-mdb-ripple-init data-mdb-ripple-color="light">重启<br>模块</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path data-icon="home"></path></svg>
            <span>主页</span>
        </a>
        <a href="edit.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path data-icon="edit"></path></svg>
            <span>编辑</span>
        </a>
    </nav>

    <!-- 自定义分区显示模态框 -->
    <div class="modal fade" id="partitions-modal" tabindex="-1" aria-labelledby="partitionsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="partitionsModalLabel">自定义分区显示</h5>
                    <button type="button" class="btn-close" data-mdb-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="partitions-modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="save-partitions-btn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="scripts.js"></script>
</body>
</html>
