<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 告知浏览器页面支持浅色和深色模式 -->
    <meta name="color-scheme" content="light dark">
    <title>电池监控 WebUI</title>
    <link rel="stylesheet" href="./style.css">
    <!-- KernelSU 沉浸式边距适配 -->
    <link rel="stylesheet" type="text/css" href="/internal/insets.css" />
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <header>
            <div class="title-group">
                <span class="icon" id="icon-android"></span>
                <h1>电池管家</h1>
            </div>
            <div class="action-group">
                <button id="btn-refresh" class="icon-btn" aria-label="刷新"></button>
                <button id="btn-exit" class="icon-btn" aria-label="退出"></button>
            </div>
        </header>

        <!-- 电池状态卡片 -->
        <div class="card">
            <div class="card-header">
                <span class="icon" id="icon-battery"></span>
                <h2>电池健康 (Sysfs)</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <label>设计容量</label>
                    <span id="val-design">--</span>
                </div>
                <div class="stat-item">
                    <label>当前全容量</label>
                    <span id="val-full">--</span>
                </div>
                <div class="stat-item">
                    <label>循环次数</label>
                    <span id="val-cycle">--</span>
                </div>
                <div class="stat-item">
                    <label>健康度 (SoH)</label>
                    <span id="val-health" class="highlight">--%</span>
                </div>
            </div>
        </div>

        <!-- 历史图表卡片 -->
        <div class="card">
            <div class="card-header">
                <span class="icon" id="icon-chart"></span>
                <h2>充电/放电趋势</h2>
            </div>
            <div class="chart-wrapper">
                <canvas id="batteryChart"></canvas>
            </div>
            <div class="card-footer">
                <small>数据源: /data/media/0/.../battery_history.csv</small>
                <button id="btn-delete" class="text-btn danger">
                    <span class="icon-sm" id="icon-delete"></span> 清除记录
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
