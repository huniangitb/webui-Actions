<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Namespace Proxy</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
    <div class="container py-3" id="main-container">
        <!-- 顶部栏 -->
        <div class="d-flex justify-content-between align-items-center mb-4 px-2">
            <div>
                <h4 class="mb-0 text-primary fw-bold">NAMESPACE PROXY</h4>
                <div class="d-flex align-items-center">
                    <span class="badge badge-success me-2" id="statusBadge">Checking</span>
                    <small id="statusInfo" class="text-muted font-monospace small">...</small>
                </div>
            </div>
            <button id="btnReload" class="btn btn-warning btn-floating shadow-0"><i class="fas fa-sync"></i></button>
        </div>

        <!-- 导航 -->
        <ul class="nav nav-tabs mb-3 shadow-0 bg-white rounded px-2" role="tablist">
            <li class="nav-item"><a class="nav-link active" href="#content-config">配置</a></li>
            <li class="nav-item"><a class="nav-link" href="#content-log">日志</a></li>
            <li class="nav-item"><a class="nav-link" href="#content-io">监控</a></li>
        </ul>

        <div class="tab-content">
            <!-- 配置页 -->
            <div class="tab-pane fade show active" id="content-config">
                <div class="card shadow-0 border mb-3">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h6 class="mb-0 fw-bold"><i class="fas fa-cog me-2 text-primary"></i>injector.conf</h6>
                        <button id="btnSaveMain" class="btn btn-primary btn-sm shadow-0">保存修改</button>
                    </div>
                    <div class="card-body p-0">
                        <textarea class="form-control font-monospace border-0 p-3" id="mainConfig" rows="10" style="resize: none;"></textarea>
                    </div>
                </div>
                <div class="card shadow-0 border">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="mb-0 fw-bold">规则文件列表</h6>
                            <button id="btnAddRule" class="btn btn-success btn-sm shadow-0"><i class="fas fa-plus"></i></button>
                        </div>
                        <div id="ruleList" class="list-group list-group-light border-0"></div>
                    </div>
                </div>
            </div>

            <!-- 日志页 -->
            <div class="tab-pane fade" id="content-log">
                <div class="card shadow-0 bg-white border"><div class="card-body">
                    <select id="logFileSelect" class="form-select mb-3 border bg-light shadow-none font-monospace"></select>
                    <div id="logViewer" class="rounded font-monospace"></div>
                </div></div>
            </div>

            <!-- IO 监控页 -->
            <div class="tab-pane fade" id="content-io">
                <div class="card shadow-0 bg-white border"><div class="card-body">
                    <div class="form-outline mb-3 border rounded">
                        <input type="text" id="ioSearch" class="form-control" />
                        <label class="form-label">搜索包名、路径、操作...</label>
                    </div>
                    <div class="table-responsive border" style="height: 450px;">
                        <table class="table table-sm table-hover text-nowrap align-middle">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th style="width: 70px">时间</th>
                                    <th style="width: 120px">应用</th>
                                    <th style="width: 80px" class="text-center">操作</th>
                                    <th>详情</th>
                                </tr>
                            </thead>
                            <tbody id="ioTableBody" class="font-monospace"></tbody>
                        </table>
                    </div>
                </div></div>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal fade" id="ruleModal" tabindex="-1">
        <div class="modal-dialog modal-lg"><div class="modal-content border-0">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">编辑应用规则</h5>
                <button type="button" class="btn-close btn-close-white" data-mdb-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="form-outline mb-4 border rounded">
                    <input type="text" id="modalRuleName" class="form-control" />
                    <label class="form-label">包名 (Pkg Name)</label>
                </div>
                <div class="form-outline border rounded">
                    <textarea class="form-control font-monospace" id="modalRuleContent" rows="10"></textarea>
                    <label class="form-label">规则内容</label>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button id="btnModalSave" class="btn btn-primary w-100 shadow-0">保存并应用</button>
            </div>
        </div></div>
    </div>
    <script src="index.js" type="module"></script>
</body>
</html>
