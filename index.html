<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Namespace Proxy</title>
</head>
<body>
    <div class="mx-app">
        <!-- 移动端顶栏 -->
        <header class="mx-topbar">
            <div class="mx-topbar-left">
                <div class="mx-logo">
                    <span class="mx-logo-icon" id="logoIconMobile"></span>
                    <span class="mx-logo-text">Namespace Proxy</span>
                </div>
            </div>
            <div class="mx-topbar-right">
                <span class="mx-badge mx-badge-gray" id="statusBadgeMobile">...</span>
                <button class="mx-btn-icon mx-theme-toggle" id="btnThemeToggleMobile"></button>
                <button class="mx-btn-icon" id="btnSettingsMobile"></button>
                <button class="mx-btn-icon" id="btnToggleStatusMobile"></button>
            </div>
        </header>
        <!-- 桌面端侧边栏 -->
        <aside class="mx-sidebar">
            <div class="sidebar-logo">
                <span class="mx-logo-icon" id="logoIconDesktop" style="width:28px;height:28px"></span>
                <span style="font-size:16px;font-weight:700">Console</span>
            </div>
            <div class="mx-sidebar-section">控制台</div>
            <div class="mx-nav-item active" data-section="apps">
                <span class="nav-icon" id="navIconApps"></span><span class="mx-nav-label">应用配置</span>
            </div>
            <div class="mx-nav-item" data-section="global">
                <span class="nav-icon" id="navIconGlobal"></span><span class="mx-nav-label">全局规则</span>
            </div>
            <div class="mx-nav-item" data-section="io">
                <span class="nav-icon" id="navIconIo"></span><span class="mx-nav-label">监控</span>
            </div>
            <div class="mx-nav-item" data-section="log">
                <span class="nav-icon" id="navIconLog"></span><span class="mx-nav-label">日志</span>
            </div>
            <div class="mx-sidebar-bottom">
                <div class="status-panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                        <span class="mx-badge mx-badge-gray" id="statusBadgeDesktop">...</span>
                        <small id="statusInfo" class="text-muted" style="font-size:11px; font-family:var(--mx-font-mono)">Checking</small>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="mx-btn mx-btn-secondary mx-btn-icon" id="btnSettingsDesktop" style="flex:1"></button>
                        <button class="mx-btn mx-btn-primary mx-btn-icon" id="btnToggleStatusDesktop" style="flex:1"></button>
                        <button class="mx-btn mx-btn-secondary mx-btn-icon mx-theme-toggle" id="btnThemeToggleDesktop" style="flex:1"></button>
                    </div>
                </div>
            </div>
        </aside>
        <!-- 桌面端顶栏占位 -->
        <div class="mx-desktop-shell">
            <header class="mx-desktop-topbar">
                <div class="mx-breadcrumb">
                    <span>Namespace Proxy</span>
                    <span class="mx-breadcrumb-sep">›</span>
                    <span id="breadcrumbTitle">应用配置</span>
                </div>
            </header>
        </div>
        <!-- 主内容区 -->
        <main class="mx-desktop-main mx-body">
            <!-- 1. 应用配置 -->
            <div class="demo-section active" id="sec-apps">
                <div class="mx-page-head mx-anim-slide-up">
                    <h1 class="mx-page-title">应用配置</h1>
                    <p class="mx-page-sub">管理目标应用的空间隔离与路径规则</p>
                </div>
                <div class="mx-card mx-anim-card-in flex-col-full">
                    <div class="mx-card-head" style="border-bottom: 1px solid var(--mx-border); padding-bottom: 12px; flex-wrap: wrap; gap: 10px;">
                        <div class="mx-input-wrap search-bar-wrap" style="flex: 1; min-width: 200px;">
                            <span class="mx-input-icon" id="iconSearch"></span>
                            <input type="text" class="mx-input" id="appSearch" placeholder="搜索应用名称或包名..." />
                        </div>
                        <div class="mx-pill-group" id="appFilterGroup">
                            <button class="active" data-filter="filterUser">用户</button>
                            <button data-filter="filterSystem">系统</button>
                            <button data-filter="filterBound">已配置App</button>
                        </div>
                    </div>
                    <!-- 优化后的应用卡片容器层 -->
                    <div class="mx-card-body p-0 list-scrollable relative" id="appListContainer">
                        <!-- 初始阻尼加载转圈动画 -->
                        <div id="appLoadingOverlay" class="mx-spinner-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--mx-bg); z-index: 15; display: flex;">
                            <div class="mx-spinner"></div>
                            <div style="color:var(--mx-t2); font-size:12px; font-weight:500;">载入应用环境中...</div>
                        </div>
                        <div id="appList" class="h-full overflow-y-auto"></div>
                    </div>
                </div>
            </div>
            <!-- 2. 全局规则 -->
            <div class="demo-section" id="sec-global">
                <div class="mx-page-head mx-anim-slide-up">
                    <h1 class="mx-page-title">全局规则</h1>
                    <p class="mx-page-sub">对所有应用默认生效的基础配置</p>
                </div>
                <div class="mx-card mx-anim-card-in flex-col-full" style="max-height: calc(100vh - 180px);">
                    <div class="mx-card-head">
                        <span class="mx-card-title">基础设置</span>
                        <div class="mx-pill-group">
                            <button class="active" data-mode="visual" name="globalModeToggle">图形</button>
                            <button data-mode="raw" name="globalModeToggle">源码</button>
                        </div>
                    </div>
                    <div class="mx-card-body flex-col-full overflow-hidden p-0">
                        <div class="editor-pane active" id="globalVisual">
                            <div class="p-4 flex-col gap-4 overflow-y-auto editor-scroll" style="height:100%">
                                <div class="mx-form-group flex-shrink-0">
                                    <label class="mx-label">全局应用注入</label>
                                    <select id="globalInjectSelect" class="mx-select">
                                        <option value="">默认 (关闭)</option>
                                        <option value="ON">开启</option>
                                        <option value="OFF">关闭</option>
                                    </select>
                                </div>
                                <div class="grid-2 gap-4 flex-shrink-0">
                                    <div class="mx-form-group">
                                        <label class="mx-label">全局监控</label>
                                        <select id="globalMonitorSelect" class="mx-select">
                                            <option value="">默认 (OFF)</option>
                                            <option value="ON">开启</option>
                                            <option value="OFF">关闭</option>
                                        </select>
                                    </div>
                                    <div class="mx-form-group">
                                        <label class="mx-label">全局沙盒</label>
                                        <select id="globalSandboxSelect" class="mx-select">
                                            <option value="">默认 (关闭)</option>
                                            <option value="ON">开启</option>
                                            <option value="OFF">关闭</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="divider flex-shrink-0"></div>
                                <div style="display:flex; justify-content:space-between; align-items:center;" class="flex-shrink-0">
                                    <h3 style="font-size:14px; font-weight:600; margin:0;">全局路径映射</h3>
                                    <button class="mx-btn mx-btn-secondary mx-btn-sm" id="btnGlobalAddRule">添加规则</button>
                                </div>
                                <div id="globalRuleBuilderContainer" class="flex-col gap-2 flex-grow"></div>
                            </div>
                        </div>
                        <div class="editor-pane" id="globalRaw">
                            <textarea id="globalRuleContent" class="mx-code-editor"></textarea>
                        </div>
                    </div>
                    <div class="mx-card-foot">
                        <button class="mx-btn mx-btn-primary w-full" id="btnSaveGlobal">保存全局规则</button>
                    </div>
                </div>
            </div>
            <!-- 3. 监控 -->
            <div class="demo-section" id="sec-io">
                <div class="mx-page-head mx-anim-slide-up">
                    <h1 class="mx-page-title">文件监控</h1>
                </div>
                <div class="mx-card mx-anim-card-in flex-col-full">
                    <div class="mx-card-head gap-2" style="padding-bottom: 12px; border-bottom: 1px solid var(--mx-border);">
                        <div class="mx-input-wrap" style="flex:1;">
                            <span class="mx-input-icon" id="iconIoSearch"></span>
                            <input type="text" id="ioSearch" class="mx-input" placeholder="搜索操作或路径..." />
                        </div>
                        <button class="mx-btn mx-btn-secondary mx-btn-icon mx-tooltip" id="btnMonitorIgnore"></button>
                        <button class="mx-btn mx-btn-danger mx-btn-icon mx-tooltip" id="btnClearIo"></button>
                    </div>
                    <div class="mx-card-body p-0 list-scrollable" id="ioLogContainer" style="background: var(--mx-bg);">
                        <div id="ioLogList" class="flex-col p-0"></div>
                        <div id="ioLoadingIndicator" class="text-center text-muted p-2 hidden" style="font-size:12px;">加载中...</div>
                    </div>
                </div>
            </div>
            <!-- 4. 日志 -->
            <div class="demo-section" id="sec-log">
                <div class="mx-page-head mx-anim-slide-up">
                    <h1 class="mx-page-title">运行日志</h1>
                </div>
                <div class="mx-card mx-anim-card-in flex-col-full" style="max-height: calc(100vh - 180px);">
                    <div class="mx-card-head" style="padding-bottom:10px;border-bottom: 1px solid var(--mx-border);">
                        <select id="logSourceSelect" class="mx-select" style="width: 140px;">
                            <option value="internal">注入日志</option>
                            <option value="zygisk">Zygisk (Logcat)</option>
                        </select>
                        <select id="logLevelSelect" class="mx-select" style="width: 100px;">
                            <option value="-1">全部</option>
                            <option value="0">DEBUG</option>
                            <option value="1">INFO</option>
                            <option value="2">WARN</option>
                            <option value="3">ERROR</option>
                        </select>
                        <button class="mx-btn mx-btn-danger mx-btn-sm" id="btnClearLog">清空日志</button>
                    </div>
                    <div class="mx-card-body p-0 flex-col-full relative" style="background: var(--mx-bg);">
                        <div id="logViewer" class="mx-log-viewer flex-col p-0 overflow-y-auto h-full"></div>
                        <div id="sysLoadingIndicator" class="loading-overlay hidden">加载中...</div>
                    </div>
                </div>
            </div>
        </main>
        <!-- 移动端底部导航 -->
        <nav class="mx-bottom-nav">
            <ul class="mx-bottom-nav-items">
                <li class="mx-btm-item active" data-section="apps">
                    <span class="btm-icon" id="btmIconApps"></span><span class="btm-label">应用</span>
                </li>
                <li class="mx-btm-item" data-section="global">
                    <span class="btm-icon" id="btmIconGlobal"></span><span class="btm-label">全局</span>
                </li>
                <li class="mx-btm-item" data-section="io">
                    <span class="btm-icon" id="btmIconIo"></span><span class="btm-label">监控</span>
                </li>
                <li class="mx-btm-item" data-section="log">
                    <span class="btm-icon" id="btmIconLog"></span><span class="btm-label">日志</span>
                </li>
            </ul>
        </nav>
    </div>
    <!-- 模态框：应用配置 -->
    <div class="mx-modal-overlay" id="appConfigModal">
        <div class="mx-modal large" style="margin-top: env(safe-area-inset-top);">
            <div class="mx-modal-head" style="align-items: stretch; flex-direction: column; gap: 12px; padding-bottom: 8px;">
                <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                    <div style="flex:1; min-width:0; margin-right: 12px;">
                        <h3 id="bindAppName" class="m-0 text-truncate" style="font-size:16px;">App Name</h3>
                        <div id="bindAppPkg" class="text-muted text-truncate" style="font-family:var(--mx-font-mono);font-size:11px;">com.pkg</div>
                    </div>
                    <div style="display:flex; gap:8px; align-items:center; flex-shrink:0;">
                        <div class="mx-pill-group">
                            <button class="active" data-mode="visual" name="appModeToggle">图形</button>
                            <button data-mode="raw" name="appModeToggle">源码</button>
                        </div>
                        <button class="mx-btn-close" id="btnCloseAppModal"></button>
                    </div>
                </div>
                <div class="mx-pill-group w-full scroll-x" id="appUserTabs" style="justify-content: flex-start;"></div>
            </div>
            <div class="mx-modal-body p-0 flex-col-full overflow-hidden">
                <div class="editor-pane active" id="appVisual">
                    <div class="p-4 flex-col gap-4 overflow-y-auto editor-scroll" style="height:100%">
                        <label class="mx-switch-row mx-card flex-shrink-0" style="padding:12px; border:1px solid var(--mx-border); box-shadow:none; border-radius:12px; cursor:pointer;">
                            <div>
                                <div style="font-weight:600; font-size:14px;">允许注入 (当前用户)</div>
                                <div class="text-muted" style="font-size:11px; margin-top:2px;">关闭将强制屏蔽注入，配置不生效。</div>
                            </div>
                            <label class="mx-switch">
                                <input type="checkbox" id="appEnableToggle">
                                <span class="mx-switch-track"><span class="mx-switch-thumb"></span></span>
                            </label>
                        </label>
                        <div class="grid-2 gap-4 flex-shrink-0">
                            <div class="mx-form-group">
                                <label class="mx-label">监控</label>
                                <select id="appMonitorSelect" class="mx-select">
                                    <option value="">跟随全局</option>
                                    <option value="ON">开启</option>
                                    <option value="OFF">关闭</option>
                                </select>
                            </div>
                            <div class="mx-form-group">
                                <label class="mx-label">沙盒</label>
                                <select id="appSandboxSelect" class="mx-select">
                                    <option value="">跟随全局</option>
                                    <option value="ON">开启</option>
                                    <option value="OFF">关闭</option>
                                </select>
                            </div>
                        </div>
                        <div class="divider flex-shrink-0"></div>
                        <div style="display:flex; justify-content:space-between; align-items:center;" class="flex-shrink-0">
                            <h3 style="font-size:14px; font-weight:600; margin:0;">专属路径映射</h3>
                            <button class="mx-btn mx-btn-secondary mx-btn-sm" id="btnAppAddRule">添加规则</button>
                        </div>
                        <div id="appRuleBuilderContainer" class="flex-col gap-2 flex-grow"></div>
                    </div>
                </div>
                <div class="editor-pane" id="appRaw">
                    <textarea id="appRuleContent" class="mx-code-editor"></textarea>
                </div>
            </div>
            <div class="mx-modal-foot">
                <button class="mx-btn mx-btn-danger" id="btnDeleteAppConfig">清除配置</button>
                <div style="flex:1"></div>
                <button class="mx-btn mx-btn-primary" id="btnSaveAppConfig">保存配置</button>
            </div>
        </div>
    </div>
    <!-- 模态框：监控忽略配置 -->
    <div class="mx-modal-overlay" id="monitorIgnoreModal">
        <div class="mx-modal large" style="margin-top: env(safe-area-inset-top);">
            <div class="mx-modal-head">
                <div>
                    <span class="mx-modal-title">监控过滤</span>
                    <div class="text-muted" style="font-size:11px; font-family:var(--mx-font-mono);">monitor_ignore.conf</div>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <div class="mx-pill-group">
                        <button class="active" data-mode="visual" name="ignoreModeToggle">图形</button>
                        <button data-mode="raw" name="ignoreModeToggle">源码</button>
                    </div>
                    <button class="mx-btn-close" onclick="document.getElementById('monitorIgnoreModal').classList.remove('open')"></button>
                </div>
            </div>
            <div class="mx-modal-body p-0 flex-col-full overflow-hidden">
                <div class="editor-pane active" id="ignoreVisual">
                    <div class="p-4 flex-col gap-4 overflow-y-auto editor-scroll">
                        <div style="background:rgba(52, 130, 255, 0.1); color:var(--mx-primary); padding:8px 12px; border-radius:8px; font-size:12px;">匹配规则：<b>前缀匹配</b></div>
                        <div id="ignoreBuilderContainer" class="flex-col gap-2 flex-grow"></div>
                        <button class="mx-btn mx-btn-secondary mx-btn-sm" style="align-self:flex-start" id="btnAddIgnoreRow">添加路径</button>
                    </div>
                </div>
                <div class="editor-pane" id="ignoreRaw">
                    <textarea id="monitorIgnoreContent" class="mx-code-editor"></textarea>
                </div>
            </div>
            <div class="mx-modal-foot">
                <button class="mx-btn mx-btn-primary w-full" id="btnSaveIgnore">保存过滤配置</button>
            </div>
        </div>
    </div>
    <!-- 模态框：设置 -->
    <div class="mx-modal-overlay" id="settingsModal">
        <div class="mx-modal">
            <div class="mx-modal-head">
                <span class="mx-modal-title">WebUI 设置</span>
                <button class="mx-btn-close" onclick="document.getElementById('settingsModal').classList.remove('open')"></button>
            </div>
            <div class="mx-modal-body flex-col gap-3">
                <label class="mx-switch-row mx-card" style="padding:12px; border:1px solid var(--mx-border); box-shadow:none; cursor:pointer;">
                    <div>
                        <div style="font-weight:600; font-size:14px;">跟随系统深色模式</div>
                        <div class="text-muted" style="font-size:11px; margin-top:2px;">自动适应设备主题色</div>
                    </div>
                    <label class="mx-switch">
                        <input type="checkbox" id="autoThemeToggle">
                        <span class="mx-switch-track"><span class="mx-switch-thumb"></span></span>
                    </label>
                </label>
                <label class="mx-switch-row mx-card" style="padding:12px; border:1px solid var(--mx-border); box-shadow:none; cursor:pointer;">
                    <div>
                        <div style="font-weight:600; font-size:14px;">插件规则同步</div>
                        <div class="text-muted" style="font-size:11px; margin-top:2px;">同步至 me.gm.cleaner.plugin</div>
                    </div>
                    <label class="mx-switch">
                        <input type="checkbox" id="pluginSyncToggle">
                        <span class="mx-switch-track"><span class="mx-switch-thumb"></span></span>
                    </label>
                </label>
                <div id="pluginStatusLabel" class="text-muted" style="font-size: 11px; font-family:var(--mx-font-mono);"></div>
            </div>
            <div class="mx-modal-foot">
                <button class="mx-btn mx-btn-primary w-full" id="btnSaveSettings">保存并应用</button>
            </div>
        </div>
    </div>
    <div id="toastContainer" class="mx-toast-container"></div>
    <div id="suggestionBox" class="suggestion-box"></div>
    <script src="src/main.js" type="module"></script>
</body>
</html>
