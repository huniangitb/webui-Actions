<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namespace Proxy</title>
    <!-- 仅保留 FontAwesome 图标 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div>
                <h2 class="title">NAMESPACE PROXY</h2>
                <div class="status-bar">
                    <span class="badge badge-gray" id="statusBadge">...</span>
                    <small id="statusInfo">Checking</small>
                </div>
            </div>
            <button id="btnReload" class="btn btn-icon"><i class="fas fa-sync"></i></button>
        </div>

        <!-- 导航 -->
        <div class="nav-tabs">
            <button class="nav-item active" data-target="content-apps">应用绑定</button>
            <button class="nav-item" data-target="content-envs">环境管理</button>
            <button class="nav-item" data-target="content-io">监控</button>
            <button class="nav-item" data-target="content-log">日志</button>
        </div>

        <div class="tab-content">
            <!-- 1. 应用绑定 -->
            <div id="content-apps" class="tab-pane active">
                <div class="card">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="appSearch" placeholder="搜索应用名称或包名..." />
                    </div>
                    <div class="filter-group no-scrollbar">
                        <label class="radio-btn"><input type="radio" name="appFilter" id="filterUser" checked><span>用户应用</span></label>
                        <label class="radio-btn"><input type="radio" name="appFilter" id="filterSystem"><span>系统应用</span></label>
                        <label class="radio-btn"><input type="radio" name="appFilter" id="filterBound"><span>已绑定</span></label>
                    </div>
                    <div id="appList" class="list-group"></div>
                </div>
            </div>

            <!-- 2. 环境管理 -->
            <div id="content-envs" class="tab-pane">
                <div class="card">
                    <div class="card-header">
                        <h3>环境列表</h3>
                        <button id="btnNewEnv" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> 新建</button>
                    </div>
                    <div id="envList" class="grid-list"></div>
                </div>
            </div>

            <!-- 3. 监控 -->
            <div id="content-io" class="tab-pane">
                <div class="card">
                    <div class="search-bar compact">
                        <i class="fas fa-search"></i>
                        <input type="text" id="ioSearch" placeholder="搜索操作记录..." />
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead><tr><th>时间</th><th>应用</th><th>操作</th><th>详情</th></tr></thead>
                            <tbody id="ioTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 4. 日志 -->
            <div id="content-log" class="tab-pane">
                <div class="card">
                    <select id="logFileSelect" class="form-select"></select>
                    <div id="logViewer" class="log-viewer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框：应用绑定 -->
    <div id="appConfigModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>应用绑定</h3>
                <button class="btn-close" onclick="closeModal('appConfigModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="app-info-header">
                    <div id="bindAppIcon" class="app-icon"></div>
                    <div>
                        <div id="bindAppName" class="fw-bold">App Name</div>
                        <small id="bindAppPkg" class="text-muted font-monospace">com.pkg</small>
                    </div>
                </div>
                <div class="form-group">
                    <label>选择环境</label>
                    <select id="bindEnvSelect" class="form-select"><option value="">未绑定 (清除)</option></select>
                </div>
                <div class="form-group">
                    <label>运行模式</label>
                    <div class="mode-selector">
                        <label><input type="radio" name="bindMode" id="modeDefault" value="" checked><span>默认</span></label>
                        <label><input type="radio" name="bindMode" id="modeMonitor" value="MONITOR"><span>监控</span></label>
                        <label><input type="radio" name="bindMode" id="modePassthrough" value="PASSTHROUGH"><span>直通</span></label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnSaveBinding" class="btn btn-primary full-width">保存绑定</button>
            </div>
        </div>
    </div>

    <!-- 模态框：新建环境 -->
    <div id="newEnvModal" class="modal">
        <div class="modal-content small">
            <div class="modal-header">
                <h3>新建环境</h3>
                <button class="btn-close" onclick="closeModal('newEnvModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="newEnvName" class="form-control" placeholder="例如: GameScope" />
            </div>
            <div class="modal-footer">
                <button id="btnCreateEnv" class="btn btn-primary full-width">创建</button>
            </div>
        </div>
    </div>

    <!-- 模态框：环境编辑 -->
    <div id="envEditorModal" class="modal">
        <div class="modal-content large">
            <div class="modal-header">
                <div>
                    <h3 id="editorEnvName">Env</h3>
                    <small>规则配置</small>
                </div>
                <div class="header-actions">
                    <div class="toggle-group">
                        <label><input type="radio" name="editorMode" value="visual" checked><span>图形</span></label>
                        <label><input type="radio" name="editorMode" value="raw"><span>源码</span></label>
                    </div>
                    <button class="btn-close" onclick="closeModal('envEditorModal')"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="modal-body no-padding relative">
                <div id="suggestionBox" class="suggestion-box"></div>
                
                <div id="editorVisual" class="editor-pane">
                    <div class="alert-info">路径自动映射至 <b>/data/media/0/</b></div>
                    <div id="ruleBuilderContainer"></div>
                    <div class="spacer"></div>
                </div>
                
                <div class="fab-container">
                    <button id="btnAddRuleRow" class="btn btn-primary rounded"><i class="fas fa-plus"></i> 添加规则</button>
                </div>

                <div id="editorRaw" class="editor-pane hidden">
                    <textarea id="envRuleContent" class="code-editor"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnDeleteEnv" class="btn btn-danger-outline">删除</button>
                <button id="btnSaveEnv" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
